name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://piyasanabzi.site/?r=$RANDOM" | grep -c hrmsocketonly || true
          pip install -q playwright >/dev/null 2>&1
          cat > /tmp/p.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def m():
            async with async_playwright() as p:
              b=await p.chromium.launch(executable_path="/usr/bin/google-chrome",args=["--no-sandbox"])
              pg=await b.new_page(viewport={"width":400,"height":900})
              pg.on("console",lambda m:print("CONSOLE",m.type,m.text[:200]))
              pg.on("pageerror",lambda e:print("PAGEERR",str(e)[:200]))
              def ws(w):
                print("WS open",w.url[:80])
                w.on("framereceived",lambda f:print("WS rx",str(f)[:120]))
                w.on("framesent",lambda f:print("WS tx",str(f)[:60]))
                w.on("close",lambda _:print("WS close"))
                w.on("socketerror",lambda e:print("WS err",e))
              pg.on("websocket",ws)
              import random
              await pg.goto("https://piyasanabzi.site/?r=%d"%random.randint(1,9999)); await pg.wait_for_timeout(12000)
              print("GOLD",(await pg.inner_text("#gGold")).replace("\n"," | ")[:500])
              print("FX",(await pg.inner_text("#gFx")).replace("\n"," | ")[:300])
              await b.close()
          asyncio.run(m())
          PY
          python3 /tmp/p.py 2>&1 | grep -v "binance" | head -60
