name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          curl -sS -A "$UA" https://www.haremaltin.com/ -o /tmp/h.html
          curl -sS -A "$UA" https://www.haremaltin.com/assets/js/functions.js -o /tmp/f.js
          echo "=== HTML socket ctx"; grep -n -B3 -A20 "socketonly\|fiyat_baglan" /tmp/h.html | cut -c1-300 | head -80
          echo "=== F.JS"; grep -n -B3 -A25 "socket\|io(" /tmp/f.js | cut -c1-300 | head -120
          echo "=== socket.io version"; curl -sS -A "$UA" https://www.haremaltin.com/assets/js/socket.io/dist/socket.io.js | head -c 300
