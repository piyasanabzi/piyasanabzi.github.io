name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          curl -sS -A "$UA" https://www.haremaltin.com/ -o /tmp/h.html
          python3 - <<'PY'
          import re,html
          s=open('/tmp/h.html',encoding='utf-8',errors='ignore').read()
          for code in ['ALTIN','KULCEALTIN','CEYREK_YENI','TEK_YENI','ATA_YENI','USDTRY','GUMUSTRY','AYAR22']:
              for m in list(re.finditer(r'%s'%code,s))[:3]:
                  seg=s[max(0,m.start()-400):m.start()+100]
                  t=re.sub(r'<[^>]+>',' ',seg); t=re.sub(r'\s+',' ',html.unescape(t))
                  print(code,'::',t[-260:])
          PY
