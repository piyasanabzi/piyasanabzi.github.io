name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== TRUNCGIL v4"
          curl -sS "https://finans.truncgil.com/v4/today.json?t=$(date +%s)" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('Update_Date'));[print(k,d[k]) for k in ['USD','EUR','GRA','HAS','CEYREKALTIN','YARIMALTIN','TAMALTIN','CUMHURIYETALTINI','ATAALTIN','GUMUS','ONS'] if k in d]"
          echo "=== XAUS"
          curl -sS "https://xaus.com/api/v1/spot?currency=TRY" | head -c 600; echo
          echo "=== BINANCE"
          curl -sS "https://data-api.binance.vision/api/v3/ticker/price?symbols=%5B%22USDTTRY%22,%22EURUSDT%22%5D"; echo
          echo "=== SITE (render)"
          for i in 1 2; do
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=25000 --window-size=1280,2000 --dump-dom "https://piyasanabzi.site/?r=$RANDOM" > /tmp/site.html 2>/dev/null || true
          done
          python3 - <<'PY'
          import re,html
          s=open('/tmp/site.html',encoding='utf-8',errors='ignore').read()
          for gid in ['gGold','gFx']:
              m=re.search(r'id="%s"(.*?)</div>\s*\n\s*<h2'%gid,s,re.S)
              seg=m.group(1) if m else ''
              txt=re.sub(r'<[^>]+>',' | ',seg); txt=html.unescape(re.sub(r'(\s*\|\s*)+',' | ',txt))
              print(gid, txt[:1500])
          m=re.search(r'id="liveTxt"[^>]*>([^<]*)',s); print('live:', m and m.group(1))
          PY
