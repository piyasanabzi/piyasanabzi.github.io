name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          curl -sS -A "$UA" https://www.haremaltin.com/ -o /tmp/h.html
          curl -sS -A "$UA" https://www.haremaltin.com/assets/js/functions.js -o /tmp/f.js
          grep -n "kapanis" /tmp/h.html /tmp/f.js | cut -c1-260 | head -30
          grep -n -A30 "function fiyat_isle" /tmp/h.html /tmp/f.js | cut -c1-220 | head -60
