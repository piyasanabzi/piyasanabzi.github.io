name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://piyasanabzi.site/ads.txt http://piyasanabzi.site/ads.txt https://www.piyasanabzi.site/ads.txt; do echo "== $u"; curl -sS -o /tmp/a -w "%{http_code} %{content_type} %{url_effective} redirects=%{num_redirects}\n" -L "$u"; cat /tmp/a; echo; done
          echo "== robots"; curl -sS https://piyasanabzi.site/robots.txt
          echo "== googlebot UA"; curl -sS -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -w "\n%{http_code}\n" https://piyasanabzi.site/ads.txt
          echo "== dns"; dig +short piyasanabzi.site; dig +short www.piyasanabzi.site
