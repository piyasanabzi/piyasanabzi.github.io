name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== HEADERS"; curl -sSI https://piyasanabzi.site/ | grep -iv "^x-github\|^via\|^x-served\|^x-cache\|^x-timer\|^x-fastly\|^accept-ranges\|^age\|^date"
          echo "== HTTP"; curl -sSI http://piyasanabzi.site/ | head -3
          echo "== 404"; curl -s -o /dev/null -w "%{http_code}\n" https://piyasanabzi.site/olmayan-sayfa
          for st in mobile desktop; do
            echo "== PSI $st"
            curl -sS --max-time 170 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fpiyasanabzi.site%2F&strategy=$st&category=performance&category=seo&category=accessibility&category=best-practices" > /tmp/p.json || true
            python3 - <<'PY'
          import json
          try: d=json.load(open('/tmp/p.json'))
          except Exception as e: print("parse err",e); raise SystemExit
          if 'error' in d: print(d['error'].get('message','')[:300]); raise SystemExit
          L=d['lighthouseResult']
          print({k:round(v['score']*100) if v.get('score') is not None else None for k,v in L['categories'].items()})
          A=L['audits']
          for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','total-byte-weight','interactive']:
              if k in A: print(k, A[k].get('displayValue'))
          for k,v in A.items():
              if v.get('score') is not None and v['score']<0.9 and v.get('scoreDisplayMode') in ('binary','numeric','metricSavings'):
                  print("  FAIL",k,(v.get('displayValue') or '')[:80])
          le=d.get('loadingExperience',{}); print("CrUX",le.get('overall_category'), list(le.get('metrics',{}).keys())[:3])
          PY
          done
