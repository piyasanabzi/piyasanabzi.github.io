name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          for ep in altin doviz; do
            echo "=== HAREM $ep"
            curl -sS -i -X POST "https://www.haremaltin.com/dashboard/ajax/$ep" -A "$UA" -H "X-Requested-With: XMLHttpRequest" -H "Origin: https://www.haremaltin.com" -H "Referer: https://www.haremaltin.com/" --data "dil_kodu=tr" | head -c 4000; echo
          done
          echo "=== HAREM GET ana"
          curl -sS -o /tmp/h.html -w "%{http_code}\n" -A "$UA" https://www.haremaltin.com/ ; grep -o "socket[^\"']*" /tmp/h.html | sort -u | head
          echo "=== TRUNCGIL"
          curl -sS "https://finans.truncgil.com/v4/today.json?t=$(date +%s)" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('Update_Date'));[print(k,d[k]) for k in ['USD','EUR','GBP','CHF','SAR','GRA','HAS','CEYREKALTIN','YARIMALTIN','TAMALTIN','CUMHURIYETALTINI','GUMUS'] if k in d]"
          echo "=== XAUS"; curl -sS "https://xaus.com/api/v1/spot" | head -c 300; echo
          echo "=== BINANCE"; curl -sS "https://data-api.binance.vision/api/v3/ticker/price?symbols=%5B%22USDTTRY%22,%22EURUSDT%22%5D"; echo
