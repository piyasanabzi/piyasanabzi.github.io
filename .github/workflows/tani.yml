name: Tani (gecici)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://finans.truncgil.com/v4/today.json" "https://finans.truncgil.com/today.json"; do
            echo "=== $u"
            curl -sS -D - -o /tmp/b.json -H "Origin: https://piyasanabzi.site" "$u" | grep -i -E "^HTTP|access-control|content-type|cache-control" || true
            head -c 2500 /tmp/b.json; echo
            python3 -c "import json;d=json.load(open('/tmp/b.json'));print(list(d.keys())[:80]);[print(k,json.dumps(d[k],ensure_ascii=False)) for k in d if any(s in k.upper() for s in ['GRA','CEY','YAR','TAM','ATA','GUM','HAS','USD','ONS','UPDATE'])]" || true
          done
