name: Kuyumcu sistemi uctan uca test
# YALNIZCA TEST DALI. Bu dosya main'e asla birleştirilmez.
on:
  push:
    branches: [kuyumcu-sistem-test]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: kuyumcu-sistem-test }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Yerel Supabase yapilandir
        run: |
          supabase --version
          mkdir -p /tmp/sb && cd /tmp/sb && git init -q
          supabase --workdir /tmp/sb init < /dev/null || true
          ls -la /tmp/sb /tmp/sb/supabase
          cp -r $GITHUB_WORKSPACE/supabase/migrations supabase/
          mkdir -p supabase/templates && cp $GITHUB_WORKSPACE/supabase/templates/*.html supabase/templates/
          cat supabase/config.jsonc 2>/dev/null | grep -v '^\s*//' | head -400; python3 $GITHUB_WORKSPACE/_test/sb_ayar.py supabase
      - name: Supabase baslat
        run: |
          cd /tmp/sb
          supabase --workdir /tmp/sb start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase --workdir /tmp/sb status -o env > /tmp/sb.env
          sed -E 's/(KEY|SECRET|JWT)[A-Z_]*="?([^"]{0,6})[^"]*"?/\1=\2.../' /tmp/sb.env
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - name: Veritabani guvenlik testleri (gercek Supabase)
        run: |
          set -a; . /tmp/sb.env; set +a
          python3 _test/rls_test.py "$DB_URL" supabase/migrations
      - name: Veritabanini sifirla
        run: cd /tmp/sb && supabase --workdir /tmp/sb db reset
      - name: Uctan uca test
        run: |
          set -a; . /tmp/sb.env; set +a
          export KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" MAIL_URL="${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" SITE=http://127.0.0.1:8765 REPO=$GITHUB_WORKSPACE
          echo "anahtar turu: ${KEY:0:15}..."
          printf 'window.PN_SUPA = { url: "%s", key: "%s" };\n' "$API_URL" "$KEY" > kuyumcu-pazari/ayar.js
          sed -i "s#https://\*.supabase.co#https://*.supabase.co $API_URL#g" kuyumcu-pazari/panel/index.html kuyumcu-pazari/yonetim/index.html
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python3 _test/kp_e2e.py
      - name: Mevcut site bozulmadi mi
        if: always()
        run: |
          git checkout -- kuyumcu-pazari/ayar.js kuyumcu-pazari/panel/index.html kuyumcu-pazari/yonetim/index.html
          git checkout -- _kaynak/kuyumcu kuyumcu-pazari sitemap.xml 2>/dev/null || true
          git clean -fdq kuyumcu-pazari supabase/.temp
          cd _kaynak && python3 content.py >/dev/null && python3 nav.py >/dev/null && cd .. && git status --short && test -z "$(git status --short)" && echo "build tekrar uretilebilir, fark yok"
